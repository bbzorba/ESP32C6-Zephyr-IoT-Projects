# --- System ---
# Extra heap on top of the Wi-Fi driver's 40 KB: it ran out when several
# browser tabs reconnected at once
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_LOG=y
CONFIG_ENTROPY_GENERATOR=y
# Last-resort recovery when Wi-Fi stays down (see wifi.c)
CONFIG_REBOOT=y
# CPU load on the dashboard (busy vs idle time)
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_ZVFS_OPEN_MAX=24
CONFIG_ZVFS_POLL_MAX=24

# --- Wi-Fi + IPv4 ---
CONFIG_WIFI=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_ESP32_WIFI_STA_RECONNECT=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="home-hub"
CONFIG_NET_LOG=y

# Credentials come from wifi.conf (CONFIG_WIFI_CREDENTIALS_STATIC_SSID/_PASSWORD)
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_STATIC=y

# Raises L4 connected/disconnected events (associated + IPv4 address)
CONFIG_NET_CONNECTION_MANAGER=y

# Reverse DNS (device names); the server address comes from DHCP
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_MAX_NAME_LEN=64
# The HTTP server and the DNS resolver's socket service each need one
CONFIG_ZVFS_EVENTFD_MAX=4

# LAN scan sends one probe per host in batches; the ARP table has to hold
# a whole batch of pending requests plus the entries of live HTTP clients.
CONFIG_NET_ARP_TABLE_SIZE=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=16
CONFIG_NET_TCP_TIME_WAIT_DELAY=0

# --- HTTP server + JSON ---
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=4
CONFIG_HTTP_SERVER_STACK_SIZE=4096
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=1024
CONFIG_JSON_LIBRARY=y
CONFIG_JSON_LIBRARY_FP_SUPPORT=y

# --- MQTT (live page on bbzorba.github.io, see src/mqtt_pub.c) ---
CONFIG_MQTT_LIB=y
CONFIG_MQTT_KEEPALIVE=60

# --- OTA updates: MCUboot + mcumgr over UDP port 1337 (see BOOTLOADER.md) ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_MCUMGR=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_UDP_STACK_SIZE=4096

# --- Sensors (on-die temperature, BME688) ---
CONFIG_SENSOR=y

# --- Status LED (onboard WS2812 on GPIO8) ---
CONFIG_LED_STRIP=y
