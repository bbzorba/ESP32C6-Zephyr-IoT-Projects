# Appended to MCUboot's own configuration by sysbuild.

# Espressif's MCUboot settings for the ESP32-C6
# (bootloader/mcuboot/boot/zephyr/socs/esp32c6.conf). Zephyr 4.3 only picks
# up a socs/ fragment named after the full SoC qualifier (esp32c6_hpcore),
# so that file is silently skipped and MCUboot is built with console,
# logging and slot-0 validation on. That build fails to link ("relocation
# truncated to fit"). Apply the settings here instead (its
# BOOT_MAX_IMG_SECTORS=512 is left out: Zephyr now derives it from the
# partitions automatically):
CONFIG_BOOT_VALIDATE_SLOT0=n
CONFIG_BOOT_BANNER=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_MCUBOOT_LOG_LEVEL_OFF=y
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_DEBUG=n
CONFIG_XIP=n
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0

# Our differences from Espressif's defaults: swap with rollback instead of
# overwrite-only (a new image boots once on trial and is reverted unless
# the app confirms it). The signature type comes from sysbuild.conf.
CONFIG_BOOT_UPGRADE_ONLY=n

# No MCUboot serial recovery: USB recovery goes through the ESP32-C6 ROM
# bootloader + esptool instead (`make recover`), see BOOTLOADER.md.
