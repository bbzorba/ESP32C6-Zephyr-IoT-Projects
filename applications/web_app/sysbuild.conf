# MCUboot as the second-stage bootloader (see BOOTLOADER.md):
# signed images, swap with automatic rollback, USB serial recovery.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y

# Only images signed with this key are accepted, over USB and over the air.
# The key is not in git: create it once with
#   imgtool keygen -k applications/web_app/keys/hub-signing-key.pem -t ecdsa-p256
# and back it up. Without it, no update can be installed.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="${APP_DIR}/keys/hub-signing-key.pem"
